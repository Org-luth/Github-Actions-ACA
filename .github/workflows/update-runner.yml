name: Update GitHub Actions Runner

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-actions-runner
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Update version and checksum
        id: runner
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const { data: release } = await github.rest.repos.getLatestRelease({ owner: 'actions', repo: 'runner' });
            if (release.draft || release.prerelease || !/^v\d+\.\d+\.\d+$/.test(release.tag_name)) {
              throw new Error('Expected a stable runner release with a semantic version');
            }
            const version = release.tag_name.slice(1);
            const name = `actions-runner-linux-x64-${version}.tar.gz`;
            const assets = release.assets.filter(asset => asset.name === name);
            if (assets.length !== 1 || assets[0].state !== 'uploaded' || !/^sha256:[a-f0-9]{64}$/.test(assets[0].digest || '')) {
              throw new Error(`Missing asset or SHA256 digest: ${name}`);
            }
            const original = fs.readFileSync('Dockerfile', 'utf8');
            const versions = [...original.matchAll(/^ARG RUNNER_VERSION=(\d+\.\d+\.\d+)\r?$/gm)];
            const checksums = [...original.matchAll(/^ARG RUNNER_SHA256=[a-f0-9]{64}\r?$/gm)];
            if (versions.length !== 1 || checksums.length !== 1) {
              throw new Error('Expected exactly one runner version and checksum in Dockerfile');
            }
            const current = versions[0][1].split('.').map(Number);
            const latest = version.split('.').map(Number);
            const difference = latest.map((part, index) => part - current[index]).find(part => part !== 0);
            if (difference < 0) throw new Error('Refusing to downgrade the runner');
            const updated = original
              .replace(/^ARG RUNNER_VERSION=\d+\.\d+\.\d+(?=\r?$)/m, `ARG RUNNER_VERSION=${version}`)
              .replace(/^ARG RUNNER_SHA256=[a-f0-9]{64}(?=\r?$)/m, `ARG RUNNER_SHA256=${assets[0].digest.slice(7)}`);
            if (original !== updated) fs.writeFileSync('Dockerfile', updated);
            core.setOutput('version', version);
            core.setOutput('release-url', `https://github.com/actions/runner/releases/tag/v${version}`);
      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-actions-runner
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          assignees: luth2
          add-paths: Dockerfile
          commit-message: 'fix(deps): update Actions Runner to ${{ steps.runner.outputs.version }}'
          title: 'fix(deps): update Actions Runner to ${{ steps.runner.outputs.version }}'
          body: |
            Updates the ACA runner image to ${{ steps.runner.outputs.version }}.
            The SHA256 checksum comes from the official actions/runner release asset.
            Release notes: ${{ steps.runner.outputs.release-url }}

            Start the image build workflow manually on this branch before merging:
            pull requests created using GITHUB_TOKEN do not trigger normal PR CI.