name: Validate, release and publish ACA runner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: jq --version
      - run: npm test
      - run: npm run docs:build

  release:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Version and publish GitHub release
        id: semantic
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [check, release]
    if: >-
      always() && !cancelled() && needs.check.result == 'success' &&
      (github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') ||
      needs.release.outputs.version != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 image
        env:
          IMAGE_VERSION: ${{ needs.release.outputs.version || github.sha }}
        run: |
          docker buildx build --load --platform linux/amd64 --file Dockerfile \
            --tag "runner-build:$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$IMAGE_VERSION" .
      - name: Check packaged runner and runtime tools
        run: |
          expected=$(sed -n 's/^ARG RUNNER_VERSION=//p' Dockerfile)
          actual=$(docker run --rm --entrypoint /home/runner/actions-runner/bin/Runner.Listener "runner-build:$GITHUB_SHA" --version)
          test "$actual" = "$expected"
          docker run --rm --entrypoint bash "runner-build:$GITHUB_SHA" -c \
            'test "$(id -u)" != 0 && git --version && curl --version && jq --version && bash -n ./entrypoint.sh'
      - name: Prepare registry image references
        id: images
        if: needs.release.outputs.version != ''
        uses: actions/github-script@v9
        env:
          DOCKERHUB_USER: ${{ secrets.USER_DOCKERHUB }}
          ACR_URL: ${{ secrets.URL_AZURECONTAINERREG }}
        with:
          script: |
            const username = process.env.DOCKERHUB_USER;
            if (!/^[a-z0-9][a-z0-9_-]*$/.test(username || '')) {
              throw new Error('USER_DOCKERHUB must be a Docker Hub namespace');
            }
            const address = (process.env.ACR_URL || '').trim();
            if (!address) throw new Error('URL_AZURECONTAINERREG is required');
            const registry = new URL(address.includes('://') ? address : `https://${address}`);
            if (registry.protocol !== 'https:' || registry.pathname !== '/' || registry.username || registry.password || registry.search || registry.hash) {
              throw new Error('URL_AZURECONTAINERREG must be a hostname or HTTPS origin without a path');
            }
            core.setOutput('registry', registry.host);
            core.setOutput('dockerhub', `${username}/github-actions-runner-aca`);
            core.setOutput('acr', `${registry.host}/github-actions-runner-aca`);
      - name: Login to Docker Hub
        if: needs.release.outputs.version != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.USER_DOCKERHUB }}
          password: ${{ secrets.PAT_DOCKERHUB }}
      - name: Login to private registry
        if: needs.release.outputs.version != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.images.outputs.registry }}
          username: ${{ secrets.USER_AZURECONTAINERREG }}
          password: ${{ secrets.PW_AZURECONTAINERREG }}
      - name: Publish to both registries
        if: needs.release.outputs.version != ''
        env:
          DOCKERHUB_IMAGE: ${{ steps.images.outputs.dockerhub }}
          ACR_IMAGE: ${{ steps.images.outputs.acr }}
        run: |
          for repository in "$DOCKERHUB_IMAGE" "$ACR_IMAGE"; do
            docker tag "runner-build:$GITHUB_SHA" "$repository:$RELEASE_VERSION"
            docker push "$repository:$RELEASE_VERSION"
          done
          for repository in "$DOCKERHUB_IMAGE" "$ACR_IMAGE"; do
            docker tag "runner-build:$GITHUB_SHA" "$repository:latest"
            docker push "$repository:latest"
          done